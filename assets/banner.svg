<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg3d" x1="0" y1="0" x2="1200" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <radialGradient id="orbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#818CF8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wireGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" rx="20" fill="url(#bg3d)"/>
  <circle cx="950" cy="200" r="210" fill="url(#orbGlow)"/>

  <!-- Stylized 3D icosahedron wireframe -->
  <g transform="translate(950, 200)" stroke="url(#wireGrad)" stroke-width="2" fill="none" opacity="0.9">
    <polygon points="0,-115 100,-55 100,55 0,115 -100,55 -100,-55"/>
    <polygon points="0,-70 62,-20 40,65 -40,65 -62,-20" opacity="0.75"/>
    <line x1="0" y1="-115" x2="0" y2="-70"/>
    <line x1="100" y1="-55" x2="62" y2="-20"/>
    <line x1="100" y1="55" x2="40" y2="65"/>
    <line x1="0" y1="115" x2="0" y2="65" opacity="0.5"/>
    <line x1="-100" y1="55" x2="-40" y2="65"/>
    <line x1="-100" y1="-55" x2="-62" y2="-20"/>
  </g>

  <rect x="72" y="72" width="278" height="34" rx="17" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.5"/>
  <text x="211" y="94" text-anchor="middle" fill="#38BDF8" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="1.2">WEBGPU + THREE.JS TSL</text>

  <text x="72" y="172" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="52" font-weight="800">r3f-tsl-webgpu-starter</text>
  <text x="72" y="220" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="20">
    React Three Fiber v9 · TypeScript Node Shaders · Automatic WebGL2 Fallback
  </text>

  <g transform="translate(72, 268)" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">
    <rect x="0" y="0" width="136" height="38" rx="10" fill="#1E293B" stroke="#334155"/>
    <text x="68" y="24" text-anchor="middle" fill="#38BDF8">R3F v9 + React 19</text>

    <rect x="152" y="0" width="150" height="38" rx="10" fill="#1E293B" stroke="#334155"/>
    <text x="227" y="24" text-anchor="middle" fill="#34D399">Zero Raw GLSL</text>

    <rect x="318" y="0" width="168" height="38" rx="10" fill="#1E293B" stroke="#334155"/>
    <text x="402" y="24" text-anchor="middle" fill="#818CF8">WGSL + GLSL2</text>

    <rect x="502" y="0" width="154" height="38" rx="10" fill="#1E293B" stroke="#334155"/>
    <text x="579" y="24" text-anchor="middle" fill="#F8FAFC">Pointer Reactive</text>
  </g>
</svg>
